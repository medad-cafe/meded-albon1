<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مِـدَادُ الـبَــنّ - رجال ألمع</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-dark: #1C2826;
            --primary-gold: #C5A059;
            --canvas-bg: #F4F7F4;
            --card-bg: #FFFFFF;
            --text-main: #2C3E35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--canvas-bg);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, rgba(28, 40, 38, 0.70) 0%, rgba(17, 26, 25, 0.78) 100%);
            color: #FFF;
            padding: 3.5rem 2rem 2.5rem 2rem;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            position: relative;
            z-index: 10;
            overflow: hidden;
        }

        /* صورة الخلفية الفخمة داخل الهيدر بنسبة وضوح مريحة */
        header img.bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.65;
            z-index: -1;
        }

        header h1 {
            font-family: 'Amiri', serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: #F4F7F4;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        header p {
            font-size: 1.1rem;
            color: #D4AF37;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            background: rgba(28, 40, 38, 0.85);
            border: 1px solid rgba(197, 160, 89, 0.4);
            padding: 1rem 2rem;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            margin-top: 1rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .number {
            font-size: 1.4rem;
            font-weight: 700;
            color: #D4AF37;
        }

        .stat-item .label {
            font-size: 0.85rem;
            color: #E2E8F0;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .section-title {
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            color: var(--primary-dark);
            margin-bottom: 1.5rem;
            text-align: center;
            position: relative;
        }

        /* شبكة أزرار المزارع */
        .farms-grid {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            align-items: center;
            margin-bottom: 2.5rem;
        }

        .farm-btn {
            background-color: var(--primary-dark);
            color: #FFF;
            border: 1px solid var(--primary-gold);
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            max-width: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .farm-btn:hover {
            background-color: #2D403C;
            transform: translateY(-2px);
            border-color: #FFF;
        }

        /* كارت عرض بيانات المزرعة التفاعلي */
        .farm-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border-top: 4px solid var(--primary-gold);
            margin-bottom: 2.5rem;
            display: none; /* مخفي حتى يتم الضغط على المزرعة */
            animation: fadeIn 0.4s ease-in-out;
        }

        .farm-card.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .farm-card h2 {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
        }

        .location-tag {
            display: inline-block;
            background: #EBF3ED;
            color: var(--primary-dark);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .info-box {
            background: #F9FBF9;
            border: 1px solid #E2E8F0;
            padding: 1rem;
            border-radius: 10px;
            text-align: center;
        }

        .info-box .val {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        .info-box .lbl {
            font-size: 0.85rem;
            color: #666;
        }

        .map-btn {
            display: block;
            text-align: center;
            background: var(--primary-dark);
            color: #FFF;
            padding: 0.8rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            transition: background 0.3s;
        }

        .map-btn:hover {
            background: #2D403C;
        }

        /* نموذج إرسال بيانات المزرعة */
        .form-section {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 1px solid #E2E8F0;
        }

        .form-section h3 {
            color: var(--primary-dark);
            margin-bottom: 1.2rem;
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
            color: var(--primary-dark);
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .submit-btn {
            background: var(--primary-gold);
            color: #FFF;
            border: none;
            padding: 0.9rem;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background: #B38F4B;
        }
    </style>
</head>
<body>

    <header>
        <img src="bon.png" alt="خلفية الهيدر" class="bg-img">
        <h1>مِـدَادُ الـبَــنّ</h1>
        <p>خريطة وأدب ومهرجانات البن في رجال ألمع</p>
        
        <div class="stats-container">
            <div class="stat-item">
                <div class="number">9</div>
                <div class="label">المزارع الموثقة</div>
            </div>
            <div class="stat-item">
                <div class="number">2,900</div>
                <div class="label">إجمالي الأشجار</div>
            </div>
            <div class="stat-item">
                <div class="number">1600م</div>
                <div class="label">أعلى ارتفاع</div>
            </div>
        </div>
    </header>

    <div class="container">
        
        <h2 class="section-title">خريطة ومسار مزارع البن</h2>
        
        <!-- أزرار المزارع (الخريطة التفاعلية) -->
        <div class="farms-grid">
            <button class="farm-btn" onclick="showFarm('yasser')"><i class="fa-solid fa-tree"></i> مزارع الياسر (جبل قيس)</button>
            <button class="farm-btn" onclick="showFarm('rawabi')"><i class="fa-solid fa-tree"></i> مزرعة الروابي</button>
            <button class="farm-btn" onclick="showFarm('qaisi')"><i class="fa-solid fa-tree"></i> مزارع محمد أحمد القيسي</button>
            <button class="farm-btn" onclick="showFarm('mesfer')"><i class="fa-solid fa-tree"></i> مزارع محمد أحمد مسفر</button>
            <button class="farm-btn" onclick="showFarm('nasser')"><i class="fa-solid fa-tree"></i> مزارع محمد عبدالله ناصر</button>
            <button class="farm-btn" onclick="showFarm('fahmi')"><i class="fa-solid fa-tree"></i> مزارع محمد يحيى الفاحمي</button>
            <button class="farm-btn" onclick="showFarm('hasi')"><i class="fa-solid fa-tree"></i> مزارع عايض أحمد آل حاصي</button>
            <button class="farm-btn" onclick="showFarm('wujayf')"><i class="fa-solid fa-tree"></i> مزرعة الوجيف</button>
            <button class="farm-btn" onclick="showFarm('nokhba')"><i class="fa-solid fa-tree"></i> مزرعة نخبة البن</button>
        </div>

        <!-- الفراغ التفاعلي الذي ستظهر فيه بيانات المزرعة عند الضغط عليها -->
        <div id="farmDetailsContainer">
            <div style="text-align: center; color: #777; padding: 1.5rem; background: #FFF; border-radius: 12px; margin-bottom: 2.5rem; border: 1px dashed #CBD5E1;">
                <i class="fa-solid fa-hand-pointer" style="font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--primary-gold);"></i>
                <p>اضغطي على أي مزرعة من القائمة أعلاه لعرض تفاصيلها وبياناتها هنا مباشرة</p>
            </div>
        </div>

        <!-- نموذج إرسال بيانات المزارعة (مربوط بـ Formspree) -->
        <div class="form-section">
            <h3><i class="fa-solid fa-pen-to-square"></i> نموذج إرسال بيانات المزرعة</h3>
            <form action="https://formspree.io/f/xeaagdlp" method="POST">
                <div class="form-group">
                    <label>اسم المزارع:</label>
                    <input type="text" name="اسم_المزرعة" required placeholder="مثال: مزارع آل فلان">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>عدد الأشجار:</label>
                        <input type="number" name="عدد_الأشجار" required placeholder="مثال: 350">
                    </div>
                    <div class="form-group">
                        <label>الارتفاع (متر):</label>
                        <input type="number" name="الارتفاع" required placeholder="مثال: 1600">
                    </div>
                </div>

                <button type="submit" class="submit-btn">إرسال البيانات</button>
            </form>
        </div>

    </div>

    <script>
        // قاعدة بيانات المزارع لتظهر فور الضغط عليها في الفراغ المخصص
        const farmsData = {
            yasser: { name: "مزارع الياسر (جبل قيس)", location: "جبل قيس - رجال ألمع", trees: "750", height: "1600 متر", map: "https://maps.google.com" },
            rawabi: { name: "مزرعة الروابي", location: "جبل صلب - رجال ألمع", trees: "600", height: "1550 متر", map: "https://maps.google.com" },
            qaisi: { name: "مزارع محمد أحمد القيسي", location: "رجال ألمع", trees: "400", height: "1500 متر", map: "https://maps.google.com" },
            mesfer: { name: "مزارع محمد أحمد مسفر", location: "رجال ألمع", trees: "350", height: "1480 متر", map: "https://maps.google.com" },
            nasser: { name: "مزارع محمد عبدالله ناصر", location: "رجال ألمع", trees: "300", height: "1450 متر", map: "https://maps.google.com" },
            fahmi: { name: "مزارع محمد يحيى الفاحمي", location: "رجال ألمع", trees: "250", height: "1400 متر", map: "https://maps.google.com" },
            hasi: { name: "مزارع عايض أحمد آل حاصي", location: "رجال ألمع", trees: "200", height: "1380 متر", map: "https://maps.google.com" },
            wujayf: { name: "مزرعة الوجيف", location: "رجال ألمع", trees: "150", height: "1350 متر", map: "https://maps.google.com" },
            nokhba: { name: "مزرعة نخبة البن", location: "رجال ألمع", trees: "100", height: "1300 متر", map: "https://maps.google.com" }
        };

        function showFarm(farmKey) {
            const farm = farmsData[farmKey];
            const container = document.getElementById('farmDetailsContainer');
            
            container.innerHTML = `
                <div class="farm-card active">
                    <h2>${farm.name}</h2>
                    <span class="location-tag"><i class="fa-solid fa-location-dot"></i> ${farm.location}</span>
                    
                    <div class="info-grid">
                        <div class="info-box">
                            <div class="val">${farm.trees} شجرة</div>
                            <div class="lbl"><i class="fa-solid fa-tree"></i> عدد الأشجار</div>
                        </div>
                        <div class="info-box">
                            <div class="val">${farm.height}</div>
                            <div class="lbl"><i class="fa-solid fa-mountain"></i> الارتفاع عن سطح البحر</div>
                        </div>
                    </div>
                    <a href="${farm.map}" target="_blank" class="map-btn"><i class="fa-solid fa-map-location-dot"></i> فتح في خرائط Google</a>
                </div>
            `;
        }
    </script>
</body>
</html>
